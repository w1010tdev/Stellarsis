{% extends "base.html" %}

{% block head %}
    <title>403 禁止访问 - 群星议会</title>
{% endblock %}

{% block additional_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/errors.css') }}">
{% endblock %}

{% block content %}
    <div class="error-container">
        <div class="error-code">403</div>
        <h1 class="error-message">禁止访问</h1>
        <p class="error-description">
            您没有权限访问此页面。可能是因为您没有登录，或者您的账户没有足够的权限。
        </p>
        <a href="/" class="btn-home">返回首页</a>
    </div>
{% endblock %}
