{% extends "base.html" %}

{% block head %}<title>数据库管理 - 群星议会</title>{% endblock %}
{% block additional_css%}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
{% endblock %}
{% block content %}
<div class="db-admin-container">
    <h2>SQLite数据库管理</h2>
    <p class="description">查看和管理数据库中的所有表</p>

    <div class="table-list">
        <h3>数据库表</h3>
        <div class="table-grid">
            {% for table in tables %}
            <div class="table-card">
                <h4>{{ table }}</h4>
                <button class="btn btn-primary" onclick="window.location.href='{{ url_for('db_table_view', table_name=table) }}'">查看数据</button>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

{% endblock %}
