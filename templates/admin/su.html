{% extends "base.html" %}
{% block additional_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
{% endblock %}
{% block content %}
<div class="su-container">
    <div class="su-icon">🛡️</div>
    <h2 class="su-title">需要 SU 验证</h2>
    <p class="su-desc">您正在访问管理面板，请输入密码以继续。验证成功后 5 分钟内无需再次验证。</p>
    
    <form method="POST" action="{{ url_for('admin_su', next=next) }}">
        <div class="form-group">
            <label for="password">管理员密码</label>
            <input type="password" id="password" name="password" class="form-control" required autofocus>
        </div>
        <button type="submit" class="submit-btn">验证并继续</button>
    </form>
    
    <div style="margin-top: 20px;">
        <a href="{{ url_for('index') }}" style="color: var(--text-muted); text-decoration: none; font-size: 14px;">返回首页</a>
    </div>
</div>
{% endblock %}
