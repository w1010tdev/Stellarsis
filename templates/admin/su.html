{% extends "base.html" %}
{% block additional_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
<style>
    .su-container {
        max-width: 400px;
        margin: 50px auto;
        padding: 30px;
        background: var(--bg-secondary);
        border-radius: 12px;
        box-shadow: var(--shadow-lg);
        text-align: center;
    }
    .su-icon {
        font-size: 48px;
        margin-bottom: 20px;
        color: var(--primary-color);
    }
    .su-title {
        margin-bottom: 10px;
        font-size: 24px;
        font-weight: 600;
    }
    .su-desc {
        margin-bottom: 25px;
        color: var(--text-muted);
        font-size: 14px;
    }
    .form-group {
        margin-bottom: 20px;
        text-align: left;
    }
    .form-control {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        background: var(--bg-primary);
        color: var(--text-primary);
    }
    .submit-btn {
        width: 100%;
        padding: 12px;
        background: var(--primary-color);
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
    }
    .submit-btn:hover {
        opacity: 0.9;
    }
</style>
{% endblock %}
{% block content %}
<div class="su-container">
    <div class="su-icon">🛡️</div>
    <h2 class="su-title">需要 SU 验证</h2>
    <p class="su-desc">您正在访问管理面板，请输入密码以继续。验证成功后 5 分钟内无需再次验证。</p>
    
    <form method="POST" action="{{ url_for('admin_su', next=next) }}">
        <div class="form-group">
            <label for="password">管理员密码</label>
            <input type="password" id="password" name="password" class="form-control" required autofocus>
        </div>
        <button type="submit" class="submit-btn">验证并继续</button>
    </form>
    
    <div style="margin-top: 20px;">
        <a href="{{ url_for('index') }}" style="color: var(--text-muted); text-decoration: none; font-size: 14px;">返回首页</a>
    </div>
</div>
{% endblock %}
