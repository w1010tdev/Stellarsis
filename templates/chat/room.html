{% extends "base.html" %}
{% block additional_css %}
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
  crossorigin="anonymous"
  referrerpolicy="no-referrer"
/>
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/chat.css') }}"
/>
{% endblock %} {% block content %}
<div id="online-list-modal" class="modal-backdrop">
  <div class="modal-content">
    <div class="modal-header">
      <h3 class="modal-title">在线用户</h3>
      <button class="modal-close">&times;</button>
    </div>
    <div class="modal-body">
      <ul id="online-users-list"></ul>
    </div>
  </div>
</div>
<!-- 验证码模态框（由服务端触发 require_captcha 事件显示） -->
<div id="captcha-modal" class="modal-backdrop">
  <div class="modal-content small">
    <div class="modal-header">
      <h3 class="modal-title">请输入验证码</h3>
      <button class="modal-close">&times;</button>
    </div>
    <div class="modal-body">
      <div id="captcha-question" style="font-weight:600;margin-bottom:8px;"></div>
      <input id="captcha-answer" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="请输入答案" class="form-control" />
      <div style="margin-top:10px;display:flex;gap:8px;justify-content:flex-end;">
        <button id="captcha-cancel" class="btn btn-outline">取消</button>
        <button id="captcha-submit" class="btn btn-primary">提交</button>
      </div>
    </div>
  </div>
</div>
<div id="chat-container" data-permission="{{ room_permission }}">
  <div class="online-users">
    在线人数: <span id="online-count">加载中...</span>
    <button id="show-online-list" class="btn btn-secondary">
      查看在线名单
    </button>
  </div>
  <div id="chat-messages"></div>
  <div class="chat-status" id="connection-status">连接中...</div>
  <div
    id="message-input"
    class="{% if room_permission not in ['su', '777'] %}read-only{% endif %}"
  >
    <textarea
      id="message-text"
      class="auto-resize-textarea"
      placeholder="输入消息...（支持Markdown和LaTeX）"
      rows="2"
    ></textarea>
      <div style="display:flex;gap:8px;align-items:center;margin-top:6px;">
        <input id="chat-image-input" type="file" class="form-control" style="display:none;" />
        <button id="chat-upload-btn" class="btn btn-outline" style="width:auto;padding:6px;">📁 上传</button>
        <div id="chat-image-list" style="flex:1"></div>
      </div>
    <button id="send-button" class="btn btn-primary">发送</button>
  </div>
</div>

<!-- 移动端快速打开在线列表按钮 -->
<button
  id="show-online-list-mobile"
  class="mobile-online-btn"
  aria-label="在线用户"
>
  👥
</button>
<!-- 传递房间数据给JS -->
<script type="application/json" id="chat-room-data">
  {
      "room_id": {{ room.id }},
      "user_id": {{ current_user.id }},
      "username": "{{ current_user.username }}",
      "nickname": "{{ current_user.nickname or current_user.username }}",
      "color": "{{ current_user.color }}",
      "badge": "{{ current_user.badge }}",
      "permission": "{{ room_permission }}"
  }
</script>
{% endblock %} {% block scripts %} {{ super() }}
<!-- 确保socket.io加载 -->
<script>
  var global_title = document.getElementById("global_title");
  if (global_title) {
    global_title.innerText = "群星议会 - "+" {{ room.name }} ";
  }
  //移动端隐藏footer
  if (window.innerWidth <= 768) {
    var footer = document.querySelector("footer");
    if (footer) {
      footer.style.display = "none";
    }
  }
  // 添加socket.io加载状态跟踪
  document.chatIoLoaded = false;
  document.chatIoCallbacks = [];
  function onSocketIoLoaded() {
    document.chatIoLoaded = true;
    document.chatIoCallbacks.forEach((cb) => cb());
    document.chatIoCallbacks = [];
  }
  function waitForSocketIo(callback) {
    if (document.chatIoLoaded) {
      callback();
    } else {
      document.chatIoCallbacks.push(callback);
    }
  }
  // 确保socket.io加载
  if (typeof io === "undefined") {
    console.log("加载 socket.io...");
    var script = document.createElement("script");
    script.src =
      "{{ url_for('static', filename='js/vendor/socket.io.min.js') }}";
    script.onload = function () {
      console.log("socket.io 已加载");
      onSocketIoLoaded();
    };
    script.onerror = function () {
      console.error("socket.io 加载失败");
      document.body.classList.add("no-websocket");
      onSocketIoLoaded(); // 继续执行降级方案
    };
    document.head.appendChild(script);
  } else {
    onSocketIoLoaded();
  }
</script>
<!-- 确保 chat.js 在 socket.io 之后加载 -->
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
<!-- 初始化聊天 -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    waitForSocketIo(function () {
      console.log("准备初始化聊天系统");
      // 等待渲染系统就绪
      function initWhenReady() {
        if (
          typeof window.renderContent === "function" &&
          typeof window.initChat === "function"
        ) {
          console.log("所有依赖已就绪，调用 initChat");
          window.initChat();
        } else {
          console.log("等待依赖加载...");
          setTimeout(initWhenReady, 500);
        }
      }
      initWhenReady();
    });
  });
</script>
<script src="{{ url_for('static', filename='js/clipboard-polyfill.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/uploads.js') }}" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
    var btn = document.getElementById('chat-upload-btn');
    var input = document.getElementById('chat-image-input');
    if (btn && input) btn.addEventListener('click', function(e){ e.preventDefault(); input.click(); });
});
</script>
{% endblock %}
